<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi Ki Doğdunnn </title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid;
  place-items: center; padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ffe1e8,#f7c4dc,#e6d8ff);
  color: #632d49;
}
.card {
  width: 100%; max-width: 390px; padding: 32px 24px;
  text-align: center; background: #ffffffdf;
  border-radius: 24px; box-shadow: 0 12px 40px #7b315522;
}
.heart { font-size: 48px; }
h1 { font-size: 25px; }
p { line-height: 1.7; }
input, button {
  width: 100%; padding: 14px; margin-top: 12px;
  border-radius: 12px; font-size: 17px;
}
input { border: 1px solid #e3a5c1; text-align: center; letter-spacing: 8px; }
button {
  border: 0; background: #d64d85; color: white;
  cursor: pointer; font-weight: bold;
}
#message { display: none; }
#error { color: #b3264c; }
</style>
</head>
<body>
<div class="card">
  <div class="heart">💗</div>
  <section id="lock">
    <h1>Sana küçük bir sürprizim var...</h1>
    <p>Bu mesajı açmak için sana özel 4 haneli kodu gir. ❤️</p>
    <form id="pinForm">
      <input id="pin" type="password" inputmode="numeric"
        maxlength="4" pattern="[0-9]{4}" placeholder="••••"
        aria-label="Dört haneli PIN" required>
      <button type="submit">Sürprizi aç </button>
    </form>
    <p id="error"></p>
  </section>
  <section id="message">
    <h1>Senin için </h1>
    <p id="loveText">Doğum günün kutlu olsun Şirinnn. İyi ki doğmuş, iyi ki hayatımda yer edinmişsin. Kolay gelsin sana akşam görüşürüz. </p>
    <div style="font-size:36px">🌷💖🌷</div>
  </section>
</div>
<script>
const SECRET_PIN = "1030";
document.getElementById("pinForm").addEventListener("submit", function(e) {
  e.preventDefault();
  if (document.getElementById("pin").value === SECRET_PIN) {
    document.getElementById("lock").style.display = "none";
    document.getElementById("message").style.display = "block";
  } else {
    document.getElementById("error").textContent = "Kod yanlış, tekrar dene ❤️";
    document.getElementById("pin").value = "";
  }
});
</script>
</body>
</html>
